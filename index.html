<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shop</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f9}
header{background:#111;color:white;padding:15px;display:flex;justify-content:space-between}
.container{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:white;padding:15px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.card img{width:100%;border-radius:8px}
button{background:#111;color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer}
.cart{background:white;padding:20px;margin-top:30px;border-radius:10px}
</style>
</head>
<body>

<header>
<div>🛒 My Shop</div>
<div>
<a href="login.html" style="color:white;margin-right:15px">Login</a>
<a href="admin.html" style="color:white">Admin</a>
</div>
</header>

<div class="container">

<h2>Sản phẩm</h2>
<div class="grid" id="products"></div>

<div class="cart">
<h2>Giỏ hàng</h2>
<div id="cartItems"></div>
<div id="total"></div>
<button onclick="checkout()">Đặt hàng</button>
</div>

</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const supabase = createClient(
"YOUR_SUPABASE_URL",
"YOUR_ANON_KEY"
);

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function saveCart(){
localStorage.setItem("cart",JSON.stringify(cart));
}

function renderCart(){
let html="";
let total=0;
cart.forEach((item,i)=>{
total+=item.price*item.qty;
html+=`<div>
${item.name} x${item.qty} = ${item.price*item.qty} VNĐ
<button onclick="removeItem(${i})">X</button>
</div>`;
});
document.getElementById("cartItems").innerHTML=html;
document.getElementById("total").innerHTML="<b>Tổng: "+total+" VNĐ</b>";
saveCart();
}

window.removeItem=function(i){
cart.splice(i,1);
renderCart();
}

window.addToCart=function(id,name,price){
let found=cart.find(p=>p.id===id);
if(found){found.qty++}
else{cart.push({id,name,price,qty:1})}
renderCart();
}

async function loadProducts(){
const {data}=await supabase.from("products").select("*");
let html="";
data.forEach(p=>{
html+=`
<div class="card">
${p.image_url?`<img src="${p.image_url}">`:""}
<h3>${p.name}</h3>
<p><b>${p.price} VNĐ</b></p>
<p>${p.specs||""}</p>
<button onclick="addToCart('${p.id}','${p.name}',${p.price})">
Thêm vào giỏ
</button>
</div>`;
});
document.getElementById("products").innerHTML=html;
}

window.checkout=async function(){
if(cart.length===0){alert("Giỏ hàng trống");return;}
const name=prompt("Tên:");
const phone=prompt("SĐT:");
const address=prompt("Địa chỉ:");

for(let item of cart){
await supabase.from("orders").insert([{
customer_name:name,
phone,
address,
product_id:item.id,
quantity:item.qty,
total_price:item.price*item.qty
}]);
}
alert("Đặt hàng thành công!");
cart=[];
renderCart();
}

renderCart();
loadProducts();
</script>

</body>
</html>
