<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Shop</title>
<style>
body{font-family:Arial;margin:0;background:#f5f6fa}
header{background:#111;color:#fff;padding:15px;display:flex;justify-content:space-between}
header a{color:#fff;text-decoration:none;margin-left:15px}
.container{max-width:1200px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
.card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
button{background:#111;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}
button:hover{opacity:.8}
.cart{background:#fff;padding:20px;margin-top:30px;border-radius:10px}
input,textarea{width:100%;padding:8px;margin-bottom:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center}
.modal-box{background:#fff;padding:25px;border-radius:10px;width:400px}
.badge{background:red;color:white;padding:3px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>

<header>
<div>🛒 PRO SHOP</div>
<div>
<a href="track.html">Tra cứu đơn</a>
<a href="login.html">Login</a>
<a href="admin.html">Admin</a>
</div>
</header>

<div class="container">

<h2>Sản phẩm</h2>
<div class="grid" id="products"></div>

<div class="cart">
<h2>Giỏ hàng</h2>
<div id="cartItems"></div>
<input id="discountCode" placeholder="Nhập mã giảm giá">
<button onclick="applyDiscount()">Áp dụng</button>
<h3 id="total"></h3>
<button onclick="openModal()">Thanh toán</button>
</div>

</div>

<div id="orderModal" class="modal">
<div class="modal-box">
<h3>Thông tin khách hàng</h3>
<input id="name" placeholder="Họ tên">
<input id="phone" placeholder="SĐT">
<textarea id="address" placeholder="Địa chỉ"></textarea>
<button onclick="submitOrder()">Xác nhận</button>
<button onclick="closeModal()" style="background:#999">Huỷ</button>
<div id="qrBox"></div>
</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const supabase = createClient("YOUR_SUPABASE_URL","YOUR_SUPABASE_ANON_KEY");

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let discountPercent=0;
let finalTotal=0;

function saveCart(){localStorage.setItem("cart",JSON.stringify(cart));}

function renderCart(){
let html="",total=0;
cart.forEach((p,i)=>{
total+=p.price*p.qty;
html+=`<div>${p.name} x${p.qty} - ${p.price*p.qty}
<button onclick="removeItem(${i})">X</button></div>`;
});
finalTotal= total-(total*discountPercent/100);
document.getElementById("cartItems").innerHTML=html;
document.getElementById("total").innerHTML=
"Tổng: "+finalTotal+" VNĐ "+(discountPercent?`<span class="badge">-${discountPercent}%</span>`:"");
saveCart();
}

window.removeItem=(i)=>{cart.splice(i,1);renderCart();}

window.addToCart=(id,name,price)=>{
let f=cart.find(p=>p.id===id);
if(f)f.qty++; else cart.push({id,name,price,qty:1});
renderCart();
}

async function loadProducts(){
const {data}=await supabase.from("products").select("*");
let html="";
data.forEach(p=>{
html+=`
<div class="card">
<img src="${p.image_url||'https://via.placeholder.com/300'}">
<h3>${p.name}</h3>
<p>${p.price} VNĐ</p>
<button onclick="addToCart('${p.id}','${p.name}',${p.price})">Thêm</button>
</div>`;
});
document.getElementById("products").innerHTML=html;
}

window.applyDiscount=async()=>{
const code=document.getElementById("discountCode").value.trim();
if(!code)return;
const {data}=await supabase.from("discounts")
.select("*").eq("code",code).eq("active",true).single();
if(!data)return alert("Mã sai");
if(new Date(data.expiry_date)<new Date())return alert("Hết hạn");
discountPercent=data.percent;
renderCart();
}

window.openModal=()=>{if(cart.length)document.getElementById("orderModal").style.display="flex";}
window.closeModal=()=>{document.getElementById("orderModal").style.display="none";}

window.submitOrder=async()=>{
const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
const address=document.getElementById("address").value;
if(!name||!phone||!address)return alert("Nhập đủ thông tin");

const orderCode="ORD"+Date.now();

const {data:order}=await supabase.from("orders")
.insert([{order_code:orderCode,customer_name:name,phone,address,total_amount:finalTotal}])
.select().single();

for(let item of cart){
await supabase.from("order_items").insert([{
order_id:order.id,
product_id:item.id,
quantity:item.qty,
price:item.price
}]);
}

document.getElementById("qrBox").innerHTML=
`<h4>Quét QR thanh toán</h4>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PAY-${orderCode}-${finalTotal}">`;

cart=[];renderCart();
}

renderCart();
loadProducts();
</script>
</body>
</html>
