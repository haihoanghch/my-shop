<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PRO SHOP</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6fb}
header{background:#111;color:#fff;padding:15px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:20px}
.card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
.card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
button{background:#111;color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer}
.cart-panel{position:fixed;right:0;top:0;width:350px;height:100%;background:#fff;padding:20px;overflow:auto;box-shadow:-5px 0 20px rgba(0,0,0,.2)}
.badge{background:red;color:white;padding:3px 6px;border-radius:50%}
</style>
</head>
<body>

<header>
<div>🛒 PRO SHOP</div>
<div onclick="toggleCart()" style="cursor:pointer">
🛒 <span id="cartCount" class="badge">0</span>
</div>
</header>

<div class="grid" id="products"></div>

<div id="cartPanel" class="cart-panel" style="display:none">
<h2>Giỏ hàng</h2>
<div id="cartItems"></div>
<input id="discountCode" placeholder="Mã giảm giá">
<button onclick="applyDiscount()">Áp dụng</button>
<h3 id="total"></h3>

<h3>Thông tin</h3>
<input id="name" placeholder="Họ tên">
<input id="phone" placeholder="SĐT">
<input id="address" placeholder="Địa chỉ">
<button onclick="submitOrder()">Thanh toán</button>

<div id="qrBox"></div>
</div>

<script type="module">
import { supabase, formatMoney } from "./js/supabase.js"
import { addToCart, renderCart, applyDiscount, submitOrder } from "./js/cart.js"

window.applyDiscount = applyDiscount
window.submitOrder = submitOrder
window.addToCart = addToCart

window.toggleCart = ()=>{
  const p=document.getElementById("cartPanel")
  p.style.display = p.style.display==="none"?"block":"none"
}

async function loadProducts(){
  const {data} = await supabase
    .from("products")
    .select("*")
    .eq("active",true)

  let html=""
  data.forEach(p=>{
    html+=`
      <div class="card">
        <img src="${p.image_url}">
        <h3>${p.name}</h3>
        <p>${formatMoney(p.price)}</p>
        <button onclick="addToCart('${p.id}','${p.name}',${p.price})">Thêm</button>
      </div>
    `
  })
  document.getElementById("products").innerHTML=html
}

renderCart()
loadProducts()

// REALTIME AUTO CHECK
supabase
.channel('orders')
.on('postgres_changes',
{ event:'UPDATE', schema:'public', table:'orders' },
(payload)=>{
  if(payload.new.status==="paid"){
    alert("🎉 Thanh toán thành công!")
  }
})
.subscribe()

</script>
</body>
</html>
