<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO SHOP</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6fb}
header{background:#111;color:#fff;padding:15px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,.1)}
.card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
button{background:#111;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
.cart-panel{position:fixed;right:0;top:0;width:350px;height:100%;background:#fff;padding:20px;overflow:auto;box-shadow:-5px 0 20px rgba(0,0,0,.2)}
.badge{background:red;color:#fff;padding:3px 7px;border-radius:50%}
.pay-btn{display:inline-block;margin-top:10px;background:green;color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none}
</style>
</head>
<body>

<header>
<div>🛒 PRO SHOP</div>
<div onclick="toggleCart()" style="cursor:pointer">
🛒 <span id="cartCount" class="badge">0</span>
</div>
</header>

<div style="padding:20px">
<h2>Sản phẩm</h2>
<div class="grid" id="products"></div>
</div>

<div id="cartPanel" class="cart-panel" style="display:none">
<h2>Giỏ hàng</h2>
<div id="cartItems"></div>
<input id="discountCode" placeholder="Mã giảm giá">
<button onclick="applyDiscount()">Áp dụng</button>
<h3 id="total"></h3>

<h3>Thông tin khách</h3>
<input id="name" placeholder="Họ tên">
<input id="phone" placeholder="SĐT">
<input id="address" placeholder="Địa chỉ">
<button onclick="submitOrder()">Thanh toán</button>

<div id="qrBox"></div>
</div>

<script type="module">
import { supabase, formatMoney } from "./js/supabase.js"
import { addToCart, renderCart, applyDiscount, submitOrder } from "./js/cart.js"

window.applyDiscount = applyDiscount
window.submitOrder = submitOrder

window.toggleCart = () => {
  const p = document.getElementById("cartPanel")
  p.style.display = p.style.display==="none"?"block":"none"
}

async function loadProducts(){
  const {data} = await supabase
    .from("products")
    .select("*")
    .eq("active",true)

  let html=""
  data.forEach(p=>{
    html+=`
      <div class="card">
        <img src="${p.image_url}">
        <h3>${p.name}</h3>
        <p>${formatMoney(p.price)}</p>
        <button onclick="addToCart('${p.id}','${p.name}',${p.price})">Thêm</button>
      </div>
    `
  })
  document.getElementById("products").innerHTML = html
}

window.addToCart = addToCart

renderCart()
loadProducts()
</script>

</body>
</html>
