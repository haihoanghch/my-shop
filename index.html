<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Shop</title>



  <style>
    body {
      font-family: Arial;
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .product {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
    }

    img {
      max-width: 200px;
      display: block;
      margin-bottom: 10px;
    }

    button {
      background: black;
      color: white;
      padding: 8px 15px;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h1>Danh sách sản phẩm</h1>
  <div id="products">Đang tải sản phẩm...</div>




  <script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const supabaseClient = createClient(
    "https://wvfcnozpxgekyovylwjw.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2ZmNub3pweGdla3lvdnlsd2p3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0MjkzODQsImV4cCI6MjA4NzAwNTM4NH0.oDOznylKm_I1-RwHx7Xqk2LCy_tIbZzjgwhCEPeDhNw"
  );

  async function loadProducts() {
    const { data, error } = await supabaseClient
      .from("products")
      .select("*");

    if (error) {
      console.error(error);
      document.getElementById("products").innerHTML = "Lỗi tải sản phẩm";
      return;
    }

    const container = document.getElementById("products");
    container.innerHTML = "";

    data.forEach(p => {
      container.innerHTML += `
        <div style="border:1px solid #ccc;padding:10px;margin:10px;">
          ${p.image_url ? `<img src="${p.image_url}" width="150"/>` : ""}
          <h3>${p.name}</h3>
          <p>Giá: ${p.price} VNĐ</p>
          <p>${p.specs || ""}</p>
        </div>
      `;
    });
  }

  loadProducts();
</script>
</body>
</html>
