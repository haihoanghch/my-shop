<!DOCTYPE html>
<html>
<head>
  <title>My Shop</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <h1>Danh sách sản phẩm</h1>
  <div id="products"></div>

<script>
const supabaseUrl = "https://wvfcnozpxgekyovylwjw.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2ZmNub3pweGdla3lvdnlsd2p3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0MjkzODQsImV4cCI6MjA4NzAwNTM4NH0.oDOznylKm_I1-RwHx7Xqk2LCy_tIbZzjgwhCEPeDhNw";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function loadProducts() {
  const { data } = await supabase.from("products").select("*");

  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(p => {
    container.innerHTML += `
      <div style="border:1px solid #ccc; padding:10px; margin:10px;">
        <img src="${p.image_url}" width="150"/>
        <h3>${p.name}</h3>
        <p>Giá: ${p.price} VNĐ</p>
        <p>${p.specs}</p>
        <button onclick="orderProduct('${p.id}', ${p.price})">
          Đặt hàng
        </button>
      </div>
    `;
  });
}

async function orderProduct(productId, price) {
  const name = prompt("Tên của bạn:");
  const phone = prompt("Số điện thoại:");
  const address = prompt("Địa chỉ:");
  const quantity = 1;

  await supabase.from("orders").insert([
    {
      customer_name: name,
      phone: phone,
      address: address,
      product_id: productId,
      quantity: quantity,
      total_price: price * quantity
    }
  ]);

  alert("Đặt hàng thành công!");
}

loadProducts();
</script>
</body>
</html>
