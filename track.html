<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tra cứu đơn</title>
</head>
<body style="font-family:Arial;padding:40px">

<h2>Tra cứu đơn hàng</h2>
<input id="code" placeholder="Nhập mã đơn">
<button onclick="track()">Tìm</button>

<div id="result"></div>

<script type="module">
import { supabase, formatMoney } from "./js/supabase.js"

window.track = async ()=>{
  const code=document.getElementById("code").value.trim()
  if(!code) return

  const {data} = await supabase
    .from("orders")
    .select("*")
    .eq("order_code",code)
    .single()

  if(!data) return alert("Không tìm thấy")

  document.getElementById("result").innerHTML=`
    <p>Mã: ${data.order_code}</p>
    <p>Tổng tiền: ${formatMoney(data.total_amount)}</p>
    <p>Trạng thái: <b>${data.status}</b></p>
  `
}
</script>

</body>
</html>
